<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<title>حساب من | پنل سرپرست تارا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
</head>
<body data-page="account">

<header class="site-header">
  <div class="container site-header__inner">
    <a href="dashboard.html" class="brand">
      <img loading="lazy" class="brand__logo" src="../assets/img/optimized/logo-mark.webp" alt="" width="60" height="44">
      پنل سرپرست
    </a>
    <nav class="nav panel-nav" aria-label="پنل">
      <ul class="nav__links">
        <li><a href="dashboard.html">داشبورد</a></li>
        <li><a href="index.html">درخواست‌ها</a></li>
        <li data-admin-only hidden><a href="supervisors.html">سرپرستان</a></li>
        <li><a href="account.html" aria-current="page">حساب من</a></li>
        <li class="panel-nav__logout"><button class="btn btn--secondary btn--sm" type="button" data-logout>خروج</button></li>
      </ul>
      <span class="panel-header__user" data-user-name></span>
      <button class="theme-toggle" type="button" aria-pressed="false" aria-label="تغییر پوسته"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path d="M18 2L18.6178 3.23558C18.8833 3.76656 19.016 4.03205 19.1934 4.26211C19.3507 4.46626 19.5337 4.64927 19.7379 4.80664C19.9679 4.98397 20.2334 5.11672 20.7644 5.38221L22 6L20.7644 6.61779C20.2334 6.88328 19.9679 7.01603 19.7379 7.19336C19.5337 7.35073 19.3507 7.53374 19.1934 7.73789C19.016 7.96795 18.8833 8.23344 18.6178 8.76442L18 10L17.3822 8.76442C17.1167 8.23344 16.984 7.96795 16.8066 7.73789C16.6493 7.53374 16.4663 7.35073 16.2621 7.19336C16.0321 7.01603 15.7666 6.88328 15.2356 6.61779L14 6L15.2356 5.38221C15.7666 5.11672 16.0321 4.98397 16.2621 4.80664C16.4663 4.64927 16.6493 4.46626 16.8066 4.26211C16.984 4.03205 17.1167 3.76656 17.3822 3.23558L18 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 13.3893C19.689 15.689 17.2145 17.2395 14.3779 17.2395C10.1711 17.2395 6.76075 13.8292 6.76075 9.62233C6.76075 6.78554 8.31149 4.31094 10.6115 3C5.77979 3.45812 2 7.52692 2 12.4785C2 17.7371 6.26292 22 11.5215 22C16.4729 22 20.5415 18.2206 21 13.3893Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="nav__toggle" type="button" aria-expanded="false" aria-label="باز کردن منو">☰</button>
    </nav>
  </div>
</header>

<main>
  <div class="page-hero page-hero--panel">
    <div class="container">
      <h1 style="margin-bottom:var(--space-2);">حساب من</h1>
    </div>
  </div>

  <section class="section">
    <div class="container" style="max-width:560px;">
      <div class="info-card" style="margin-bottom:var(--space-6);">
        <ul class="info-list" style="margin:0;">
          <li><span>نام</span><span data-account="display_name"></span></li>
          <li><span>نام کاربری</span><span dir="ltr" data-account="username"></span></li>
          <li><span>نقش</span><span data-account="role"></span></li>
        </ul>
      </div>

      <form class="form info-card" id="password-form" novalidate>
        <h2 style="font-size:var(--text-xl); margin:0;">تغییر رمز عبور</h2>
        <div class="form-field">
          <label class="form-label" for="current-password">رمز فعلی</label>
          <input class="form-control" id="current-password" name="current" type="password" dir="ltr" autocomplete="current-password" required aria-describedby="current-password-error">
          <p class="form-error" id="current-password-error">رمز فعلی اشتباه است.</p>
        </div>
        <div class="form-field">
          <label class="form-label" for="new-password">رمز جدید</label>
          <input class="form-control" id="new-password" name="new" type="password" dir="ltr" autocomplete="new-password" minlength="8" required aria-describedby="new-password-error">
          <p class="form-error" id="new-password-error">رمز جدید باید دست‌کم ۸ کاراکتر باشد.</p>
        </div>
        <div class="form-field">
          <label class="form-label" for="repeat-password">تکرار رمز جدید</label>
          <input class="form-control" id="repeat-password" name="repeat" type="password" dir="ltr" autocomplete="new-password" required aria-describedby="repeat-password-error">
          <p class="form-error" id="repeat-password-error">تکرار رمز با رمز جدید یکسان نیست.</p>
        </div>
        <p class="form-hint" id="password-status" role="status"></p>
        <button type="submit" class="btn btn--primary">تغییر رمز</button>
        <p class="form-hint" style="margin:0;">پس از تغییر رمز، از دستگاه‌های دیگر خارج می‌شوید.</p>
      </form>
    </div>
  </section>
</main>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/panel.js"></script>
</body>
</html>
