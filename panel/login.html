<main id="main" class="login">
  <section class="login__brand" aria-hidden="true">
    <canvas class="course-bg" data-course-bg data-motif="paths" data-tone="inverse" data-intensity="0.9"></canvas>
    <a href="../index.html" class="login__logo"><img src="../assets/img/optimized/logo-mark.webp" alt="" width="64" height="48"><span>آکادمی تارا</span></a>
    <div class="login__pitch">
      <p class="login__eyebrow">پنل سرپرستان</p>
      <p class="login__headline">همه درخواست‌های دوره و مشاوره، در یک جا.</p>
      <ul class="login__points">
        <li>پیگیری درخواست‌ها با بورد و پنل کناری</li>
        <li>تقسیم کار بین سرپرستان و تاریخچه هر تغییر</li>
        <li>داشبورد روزانه و زمان‌بندی جلسات دوره‌ها</li>
      </ul>
    </div>
  </section>
  <section class="login__form-wrap">
    <button class="theme-toggle app-icon-btn login__theme" type="button" aria-pressed="false" aria-label="تغییر پوسته"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path d="M18 2L18.6178 3.23558C18.8833 3.76656 19.016 4.03205 19.1934 4.26211C19.3507 4.46626 19.5337 4.64927 19.7379 4.80664C19.9679 4.98397 20.2334 5.11672 20.7644 5.38221L22 6L20.7644 6.61779C20.2334 6.88328 19.9679 7.01603 19.7379 7.19336C19.5337 7.35073 19.3507 7.53374 19.1934 7.73789C19.016 7.96795 18.8833 8.23344 18.6178 8.76442L18 10L17.3822 8.76442C17.1167 8.23344 16.984 7.96795 16.8066 7.73789C16.6493 7.53374 16.4663 7.35073 16.2621 7.19336C16.0321 7.01603 15.7666 6.88328 15.2356 6.61779L14 6L15.2356 5.38221C15.7666 5.11672 16.0321 4.98397 16.2621 4.80664C16.4663 4.64927 16.6493 4.46626 16.8066 4.26211C16.984 4.03205 17.1167 3.76656 17.3822 3.23558L18 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 13.3893C19.689 15.689 17.2145 17.2395 14.3779 17.2395C10.1711 17.2395 6.76075 13.8292 6.76075 9.62233C6.76075 6.78554 8.31149 4.31094 10.6115 3C5.77979 3.45812 2 7.52692 2 12.4785C2 17.7371 6.26292 22 11.5215 22C16.4729 22 20.5415 18.2206 21 13.3893Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="login__card">
      <h1 class="login__title">ورود سرپرست</h1>
      <p class="login__sub">برای مشاهده درخواست‌ها وارد شوید.</p>
      <form class="form" id="login-form">
        <div class="form-field">
          <label class="form-label" for="username">نام کاربری</label>
          <input class="form-control" id="username" name="username" type="text" dir="ltr" autocomplete="username" required>
        </div>
        <div class="form-field">
          <label class="form-label" for="password">رمز عبور</label>
          <input class="form-control" id="password" name="password" type="password" dir="ltr" autocomplete="current-password" required>
        </div>
        <p class="form-alert" id="login-alert" role="alert" hidden></p>
        <button type="submit" class="btn btn--primary btn--block">ورود</button>
      </form>
      <a class="login__back" href="../index.html">بازگشت به سایت</a>
    </div>
  </section>
</main>
