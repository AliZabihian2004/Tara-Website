services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tara
      POSTGRES_USER: tara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tara -d tara"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./server
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tara:${POSTGRES_PASSWORD}@db:5432/tara
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SITE_DIR: /site
    ports:
      - "8000:8000"
    # The whole project is mounted (single-file mounts go stale when an editor replaces the file);
    # main.py only serves the public folders and pages, never .env or server/
    volumes:
      - .:/site:ro

volumes:
  db-data:
