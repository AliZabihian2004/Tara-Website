<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>درخواست‌ها | پنل سرپرست تارا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
</head>
<body data-page="list">

<header class="site-header">
  <div class="container site-header__inner">
    <a href="dashboard.html" class="brand">
      <img class="brand__logo" src="../assets/img/optimized/logo-mark.webp" alt="" width="60" height="44">
      پنل سرپرست
    </a>
    <nav class="nav panel-nav" aria-label="پنل">
      <ul class="nav__links">
        <li><a href="dashboard.html">داشبورد</a></li>
        <li><a href="index.html" aria-current="page">درخواست‌ها</a></li>
        <li data-admin-only hidden><a href="supervisors.html">سرپرستان</a></li>
        <li><a href="account.html">حساب من</a></li>
        <li class="panel-nav__logout"><button class="btn btn--secondary btn--sm" type="button" data-logout>خروج</button></li>
      </ul>
      <span class="panel-header__user" data-user-name></span>
      <button class="theme-toggle" type="button" aria-pressed="false" aria-label="تغییر پوسته"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path d="M18 2L18.6178 3.23558C18.8833 3.76656 19.016 4.03205 19.1934 4.26211C19.3507 4.46626 19.5337 4.64927 19.7379 4.80664C19.9679 4.98397 20.2334 5.11672 20.7644 5.38221L22 6L20.7644 6.61779C20.2334 6.88328 19.9679 7.01603 19.7379 7.19336C19.5337 7.35073 19.3507 7.53374 19.1934 7.73789C19.016 7.96795 18.8833 8.23344 18.6178 8.76442L18 10L17.3822 8.76442C17.1167 8.23344 16.984 7.96795 16.8066 7.73789C16.6493 7.53374 16.4663 7.35073 16.2621 7.19336C16.0321 7.01603 15.7666 6.88328 15.2356 6.61779L14 6L15.2356 5.38221C15.7666 5.11672 16.0321 4.98397 16.2621 4.80664C16.4663 4.64927 16.6493 4.46626 16.8066 4.26211C16.984 4.03205 17.1167 3.76656 17.3822 3.23558L18 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 13.3893C19.689 15.689 17.2145 17.2395 14.3779 17.2395C10.1711 17.2395 6.76075 13.8292 6.76075 9.62233C6.76075 6.78554 8.31149 4.31094 10.6115 3C5.77979 3.45812 2 7.52692 2 12.4785C2 17.7371 6.26292 22 11.5215 22C16.4729 22 20.5415 18.2206 21 13.3893Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="nav__toggle" type="button" aria-expanded="false" aria-label="باز کردن منو">☰</button>
    </nav>
  </div>
</header>

<main>
  <div class="page-hero page-hero--panel">
    <div class="container">
      <h1 style="margin-bottom:var(--space-2);">درخواست‌ها</h1>
      <p class="text-muted" style="margin:0;">درخواست‌های ثبت‌شده از فرم‌های «درخواست دوره» و «مشاوره رایگان».</p>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div class="panel-toolbar">
        <div class="tabs" role="group" aria-label="وضعیت">
          <button class="tabs__btn" type="button" data-status="" aria-pressed="true">همه <span class="tabs__count" data-count="all">۰</span></button>
          <button class="tabs__btn" type="button" data-status="new" aria-pressed="false">جدید <span class="tabs__count" data-count="new">۰</span></button>
          <button class="tabs__btn" type="button" data-status="in_progress" aria-pressed="false">در حال بررسی <span class="tabs__count" data-count="in_progress">۰</span></button>
          <button class="tabs__btn" type="button" data-status="done" aria-pressed="false">انجام‌شده <span class="tabs__count" data-count="done">۰</span></button>
        </div>
        <a class="btn btn--secondary btn--sm" id="export-link" href="/api/admin/tickets/export.csv" download>⬇ خروجی Excel</a>
      </div>

      <div class="panel-filters">
        <select class="form-control" id="filter-kind" aria-label="نوع درخواست">
          <option value="">همه انواع</option>
          <option value="course_request">درخواست دوره</option>
          <option value="consultation">مشاوره</option>
        </select>
        <select class="form-control" id="filter-assigned" aria-label="مسئول">
          <option value="">همه مسئولان</option>
          <option value="me">تیکت‌های من</option>
          <option value="none">بدون مسئول</option>
        </select>
        <select class="form-control" id="filter-course" aria-label="فیلتر دوره">
          <option value="">همه دوره‌ها</option>
        </select>
        <input class="form-control" id="filter-q" type="search" placeholder="جستجو در نام، کد ملی، تلفن، سازمان یا توضیحات" aria-label="جستجو">
      </div>

      <p class="form-alert" id="list-alert" role="alert" hidden>دریافت درخواست‌ها ناموفق بود.</p>

      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>شماره</th>
              <th>تاریخ</th>
              <th>متقاضی</th>
              <th>موضوع</th>
              <th>تلفن</th>
              <th>مسئول</th>
              <th>وضعیت</th>
            </tr>
          </thead>
          <tbody id="tickets-body"></tbody>
        </table>
      </div>

      <nav class="pagination" aria-label="صفحه‌بندی" id="pagination" hidden>
        <button class="btn btn--secondary btn--sm" type="button" data-page-prev>قبلی</button>
        <span data-page-label></span>
        <button class="btn btn--secondary btn--sm" type="button" data-page-next>بعدی</button>
      </nav>
    </div>
  </section>
</main>

<script src="../assets/js/main.js"></script>
<script src="../assets/js/panel.js"></script>
</body>
</html>
